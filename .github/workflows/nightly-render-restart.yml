name: Nightly Render restart

on:
  schedule:
    # 00:00 Europe/Moscow (UTC+3) = 21:00 UTC on the previous day.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Restart CASE-Online on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dbkcmj6k1f9s73ah4llg
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "Missing GitHub Actions secret: RENDER_API_KEY"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/restart" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json"

          echo "Restart request sent to Render."
