<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASE: Online — просмотр 3D-моделей</title>
<style>*{box-sizing:border-box}body{margin:0;background:#09090c;color:#eee;font:16px Arial}header{padding:18px 22px;background:#15151b;border-bottom:1px solid #55242a}h1{margin:0 0 6px;font-size:22px}p{margin:0;color:#aaa}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:calc(100vh - 76px)}#stage{min-height:560px;background:radial-gradient(ellipse,#25232a,#070709 75%)}canvas{display:block;width:100%;height:100%;min-height:560px}aside{padding:16px;background:#111116;border-left:1px solid #29252b}#drop{border:2px dashed #75434a;padding:20px 12px;text-align:center;border-radius:9px;margin-bottom:14px}#drop.over{background:#342027}input{width:100%;margin:8px 0 14px}button{width:100%;display:block;text-align:left;padding:11px;margin:6px 0;background:#211a20;border:1px solid #63343d;color:#eee;border-radius:5px;cursor:pointer}button:hover{background:#39232a}.file.active{border-color:#e05b66;background:#3a2027}#info{font-size:13px;line-height:1.6;color:#bbb;margin-top:14px;white-space:pre-line}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{border:0;border-top:1px solid #29252b}#stage,canvas{min-height:380px}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><header><h1>CASE: Online — тест моделей</h1><p>Перетащи GLB-файлы в окно. Файлы обрабатываются только в браузере.</p></header><div class="layout"><main id="stage"></main><aside><div id="drop">Перетащи сюда GLB-файлы</div><input id="picker" type="file" accept=".glb,.gltf" multiple><div id="files"></div><div id="info">Выбери модель для просмотра.</div></aside></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const stage=document.querySelector('#stage'),list=document.querySelector('#files'),info=document.querySelector('#info');const scene=new THREE.Scene();scene.background=new THREE.Color(0x09090c);const camera=new THREE.PerspectiveCamera(45,1,.01,1000);camera.position.set(3,2.2,4);const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xbac7df,0x28202a,2));const key=new THREE.DirectionalLight(0xffffff,2.1);key.position.set(3,7,5);scene.add(key);const rim=new THREE.DirectionalLight(0x8b2432,1.5);rim.position.set(-4,3,-4);scene.add(rim);scene.add(new THREE.GridHelper(10,20,0x4b3038,0x28232a));let current=null,mixer=null,clock=new THREE.Clock();
function resize(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}new ResizeObserver(resize).observe(stage);resize();function animate(){requestAnimationFrame(animate);if(mixer)mixer.update(clock.getDelta());controls.update();renderer.render(scene,camera)}animate();
function show(gltf,name,size){if(current)scene.remove(current);current=gltf.scene;scene.add(current);mixer=null;const box=new THREE.Box3().setFromObject(current),dims=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());current.position.sub(center);const max=Math.max(dims.x,dims.y,dims.z)||1;camera.position.set(max*1.7,max*1.1,max*2.2);controls.target.set(0,0,0);controls.update();let anim='';if(gltf.animations.length){mixer=new THREE.AnimationMixer(current);gltf.animations.forEach(clip=>{const b=document.createElement('button');b.textContent='▶ '+clip.name;b.onclick=()=>{mixer.stopAllAction();mixer.clipAction(clip).reset().play()};list.appendChild(b);anim+='• '+clip.name+'\\n'})}info.textContent=name+'\\nРазмер: '+(size/1048576).toFixed(2)+' МБ\\nГабариты: '+dims.x.toFixed(2)+' × '+dims.y.toFixed(2)+' × '+dims.z.toFixed(2)+'\\nАнимаций: '+gltf.animations.length+'\\n'+anim}
async function addFiles(files){for(const file of files){if(!/\\.gl(b|tf)$/i.test(file.name))continue;const url=URL.createObjectURL(file);try{const gltf=await new GLTFLoader().loadAsync(url);const b=document.createElement('button');b.className='file';b.textContent='◉ '+file.name;b.onclick=()=>{list.querySelectorAll('.file').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(gltf,file.name,file.size)};list.appendChild(b);if(!current)b.click()}catch(e){const b=document.createElement('button');b.textContent='Ошибка '+file.name+': '+e.message;list.appendChild(b)}finally{URL.revokeObjectURL(url)}}}
document.querySelector('#picker').addEventListener('change',e=>addFiles(e.target.files));const drop=document.querySelector('#drop');drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});drop.addEventListener('dragleave',()=>drop.classList.remove('over'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');addFiles(e.dataTransfer.files)});
</script></body></html>
