<style>@import url("https://fonts.googleapis.com/css2?family=Creepster&display=swap");
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090c;color:#e8f0f3;font:15px Arial,sans-serif}#view{display:block;width:100%;height:100%;image-rendering:pixelated}.hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px}.box{padding:9px 12px;background:#071019c9;border:1px solid #6be0d477;font-size:12px;letter-spacing:.08em}.cyan{color:#70eee0}.red{color:#ff5367}.cross{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid #d5f8f2;border-radius:50%;transform:translate(-50%,-50%);opacity:.7}.bottom{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#061019d9;border:1px solid #6be0d455;padding:8px 12px;font-size:12px}.menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-start;padding:5vw;background:linear-gradient(90deg,#020406d9 0%,#02040680 38%,#02040620 100%),url("./assets/a91fef5702f94b5c8553a3d1a0c4efe8.png") center center / cover no-repeat,#05090c}.card{position:absolute;left:3.2%;top:31%;width:min(360px,34vw);background:transparent;border:0;padding:0;box-shadow:none}

}

 -webkit-text-stroke:.45px #43070c;
 text-shadow:0 2px 3px #000,0 0 7px #8e1721,0 0 15px rgba(120,0,12,.55);
 text-align:center;white-space:normal;transition:transform .18s ease,filter .18s ease,color .18s ease
}
#menu .actions#playActions button:hover,#menu .actions#roleActions button:hover,
#menu #multiPanel>button:hover,#menu #lobbyActions button:hover{
 color:#fff;filter:brightness(1.35) drop-shadow(0 0 8px rgba(255,55,65,.55));transform:scale(1.06)
}
#menu .actions#playActions button:focus,#menu .actions#roleActions button:focus,
#menu #multiPanel button:focus,#menu #lobbyActions button:focus,
#menu .actions#playActions button:active,#menu .actions#roleActions button:active{
 outline:none!important;box-shadow:none!important
}
#menu .actions#playActions button::-moz-focus-inner,#menu .actions#roleActions button::-moz-focus-inner{border:0}

 #menu .actions#playActions,#menu .actions#roleActions{gap:8px}

}
.eyebrow{font-size:11px;letter-spacing:.2em;color:#c2a3a3}.title{position:fixed;top:7%;left:50%;transform:translateX(-50%);font-family:"Creepster","Chiller","Old English Text MT",Impact,fantasy;font-size:clamp(44px,8vw,78px);line-height:1;margin:0;text-align:center;color:#e7dede;-webkit-text-stroke:.5px #39070b;text-shadow:0 3px 12px #000,0 0 8px #72121a;white-space:nowrap}.title .cyan{color:#b72d38}.desc{color:#c0b8b8;line-height:1.55}.actions{display:grid;grid-template-columns:1fr;gap:18px;margin-top:25px}button{background:transparent;color:#e8dede;border:0;padding:8px 0;text-align:left;font-family:"Creepster","Chiller","Old English Text MT",Impact,fantasy;font-size:clamp(20px,2.6vw,28px);font-weight:900;letter-spacing:.1em;-webkit-text-stroke:.35px #3b080d;text-shadow:0 2px 2px #000,0 0 5px #6b1018,1px 1px 0 #230407;cursor:pointer}button:hover{color:#d44b55;transform:translateX(5px)}button.alt{background:transparent;color:#e8dede;border:0}button:focus{outline:1px dashed #c34a55}.note{font-size:12px;color:#b8aaaa;margin-top:18px}.field{display:block;width:100%;margin:8px 0;padding:12px;background:#080b0ddd;border:1px solid #8b7474;color:#fff;font-size:16px}.lobbyList{color:#eee;line-height:1.8;margin:12px 0;padding:10px;background:#050709aa}.status{color:#d7b9b9;font-size:13px;min-height:20px}.actions button:disabled{opacity:.35;cursor:default}@media(max-width:600px){#menu .card{bottom:2%;padding:0 2vw}#menu .actions#mainActions{gap:2vw}#menu .actions#mainActions button{flex-basis:24%;height:clamp(42px,10vh,76px)}}.hidden{display:none!important}.touch{display:none;position:fixed;bottom:18px;left:14px;right:14px;justify-content:space-between;align-items:end;pointer-events:none}.stick{display:grid;grid-template-columns:repeat(3,43px);gap:4px;pointer-events:auto}.stick button,.touchright button{background:#12232bcc;color:white;border:1px solid #70eee088;padding:10px 0;touch-action:none}.stick .blank{visibility:hidden}.touchright{display:grid;gap:6px;pointer-events:auto}.touchright button{padding:12px 10px;font-size:11px}@media(pointer:coarse){.touch{display:flex}.bottom{bottom:165px}.cross{opacity:.35}}@media(max-width:500px){.box{font-size:10px;padding:7px}.actions{grid-template-columns:1fr}.touchright button{font-size:9px;padding:10px 6px}}
</style></head><body>
<canvas id="view" width="480" height="270"></canvas>
<div id="hud" class="hud hidden"><div class="top"><div class="box" id="roleLabel">РОЛЬ</div><div class="box" id="objective">ЗАДАЧА</div><div class="box">СМЕНА <span id="clock" class="cyan">00:00</span></div></div><div class="cross"></div><div class="bottom" id="hint">WASD — движение · мышь — обзор · F — фонарь</div></div>
<div class="touch" id="touch"><div class="stick"><button class="blank">.</button><button data-key="w">▲</button><button class="blank">.</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div><div class="touchright"><button id="touchUse">ДЕЙСТВИЕ</button><button id="touchPower">ФОНАРЬ / НОЧНОЕ ЗРЕНИЕ</button></div></div>
<div class="menu" id="menu"><div class="card"><div class="actions" id="mainActions"><button id="play" aria-label="Играть"><img src="./assets/play.png" alt="Играть"></button><button id="settings" aria-label="Настройки"><img src="./assets/settings_edit_94699366183985.png" alt="Настройки"></button><button id="language" aria-label="Язык: русский"><img src="./assets/language.png" alt="Язык"></button><button id="exit" aria-label="Выход"><img src="./assets/exit_edit_94718246242837.png" alt="Выход"></button></div><div class="actions hidden" id="playActions"><button id="single">ОДИНОЧНАЯ ИГРА</button><button id="multi">МНОГОПОЛЬЗОВАТЕЛЬСКАЯ ИГРА</button><button id="mainBack">НАЗАД</button></div><div class="actions hidden" id="roleActions"><button id="survivor">ИГРОК (ИИ)</button><button id="animatronic">АНИМАТРОНИК</button><button id="roleBack">НАЗАД</button></div><div class="hidden" id="multiPanel"><input class="field" id="playerName" maxlength="18" placeholder="Твоё имя"><button id="createRoom">СОЗДАТЬ КОМНАТУ</button><input class="field" id="roomCode" maxlength="5" placeholder="КОД КОМНАТЫ"><button id="joinRoom">ВОЙТИ ПО КОДУ</button><div class="lobbyList hidden" id="lobbyList"></div><div class="actions hidden" id="lobbyActions"><button id="readyBtn">ГОТОВ</button><button id="startBtn">НАЧАТЬ МАТЧ</button><button id="leaveBtn">ВЫЙТИ ИЗ КОМНАТЫ</button></div><button id="multiBack">НАЗАД</button></div><p class="note" id="menuNote">Выбери пункт меню.</p></div></div>
<div class="menu hidden" id="end"><div class="card"><div class="eyebrow">СМЕНА ЗАВЕРШЕНА</div><h2 class="title" id="endTitle">Пойман!</h2><p class="desc" id="endText"></p><button id="back">В МЕНЮ</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d',{alpha:false});
const W=canvas.width,H=canvas.height,FOV=Math.PI/2.7;
const map=[
'1111111111111111',
'1000000000000001',
'1011100110111001',
'1000100000100001',
'1110101100101101',
'1000001000000001',
'1011001001101101',
'1000000000000001',
'1011011101110101',
'1000000000000001',
'1111111111111111'];
const keys={};let role='survivor',running=false,angle=0,px=2.5,py=1.5,mx=12.5,my=8.5,elapsed=0,last=0,night=false,flash=true,battery=100,found=0,networkGame=false,remotePlayers={},lastNetSend=0;
const $=id=>document.getElementById(id);
function wall(x,y){return y<0||y>=map.length||x<0||x>=map[0].length||map[Math.floor(y)][Math.floor(x)]==='1'}
function move(x,y,dx,dy){if(!wall(x+dx+.14*Math.sign(dx),y))x+=dx;if(!wall(x,y+dy+.14*Math.sign(dy)))y+=dy;return[x,y]}
function start(r){networkGame=false;remotePlayers={};role=r;px=2.5;py=1.5;angle=0;mx=12.5;my=8.5;elapsed=0;night=false;flash=true;battery=100;found=0;running=true;$('menu').classList.add('hidden');$('end').classList.add('hidden');$('hud').classList.remove('hidden');$('roleLabel').textContent=r==='survivor'?'РОЛЬ: ВЫЖИВШИЙ':'РОЛЬ: АНИМАТРОНИК';$('objective').textContent=r==='survivor'?'НАЙДИ ВЫХОД':'НАЙДИ ИГРОКА';$('hint').textContent=r==='survivor'?'WASD — движение · мышь — обзор · F — фонарь':'WASD — движение · мышь — обзор · F — ночное видение';last=performance.now();requestAnimationFrame(loop)}
function castRay(a){let d=0,step=.035;while(d<18){d+=step;let x=px+Math.cos(a)*d,y=py+Math.sin(a)*d;if(wall(x,y))return{d:d*Math.cos(a-angle),x,y}}return{d:18,x:px+Math.cos(a)*18,y:py+Math.sin(a)*18}}
function render(){ctx.fillStyle=role==='animatronic'&&night?'#071b20':'#080d12';ctx.fillRect(0,0,W,H/2);ctx.fillStyle=role==='animatronic'&&night?'#102b2d':'#17191b';ctx.fillRect(0,H/2,W,H/2);
for(let x=0;x<W;x++){let a=angle-FOV/2+x/W*FOV,r=castRay(a),d=Math.max(.08,r.d),height=Math.min(H,H/d),shade=Math.max(8,Math.min(190,150/(1+d*.17)));let isNight=role==='animatronic'&&night;ctx.fillStyle=isNight?'rgb('+Math.floor(shade*.22)+','+Math.floor(shade*1.1)+','+Math.floor(shade*.95)+')':'rgb('+Math.floor(shade*.65)+','+Math.floor(shade*.78)+','+Math.floor(shade*.85)+')';ctx.fillRect(x,(H-height)/2,1,height);if((Math.floor(r.x*4)+Math.floor(r.y*4))%3===0){ctx.fillStyle=isNight?'#12383a':'#303d43';ctx.fillRect(x,(H-height)/2+height*.55,1,1)}}
if(!networkGame){let dx=mx-px,dy=my-py,dist=Math.hypot(dx,dy),bearing=Math.atan2(dy,dx)-angle;bearing=Math.atan2(Math.sin(bearing),Math.cos(bearing));if(Math.abs(bearing)<FOV/2&&dist>.2){let sx=(.5+bearing/FOV)*W,sz=Math.min(H,H/dist*.52);if(role==='animatronic'&&night||dist<4.2){ctx.fillStyle=role==='animatronic'&&night?'#62ffe2':'#761e2b';ctx.fillRect(sx-sz*.12,H/2-sz*.35,sz*.24,sz*.7);ctx.fillStyle='#ff4e64';ctx.fillRect(sx-sz*.08,H/2-sz*.17,sz*.045,sz*.035);ctx.fillRect(sx+sz*.035,H/2-sz*.17,sz*.045,sz*.035)}}}
for(const p of Object.values(remotePlayers)){let dx=p.x-px,dy=p.y-py,dist=Math.hypot(dx,dy),bearing=Math.atan2(dy,dx)-angle;bearing=Math.atan2(Math.sin(bearing),Math.cos(bearing));if(Math.abs(bearing)<FOV/2&&dist>.2&&(role==='animatronic'&&night||dist<5)){let sx=(.5+bearing/FOV)*W,sz=Math.min(H,H/dist*.5);ctx.fillStyle=p.role==='animatronic'?'#4fffe0':'#8b2532';ctx.fillRect(sx-sz*.13,H/2-sz*.34,sz*.26,sz*.68);ctx.fillStyle='#ff5265';ctx.fillRect(sx-sz*.075,H/2-sz*.16,sz*.045,sz*.035);ctx.fillRect(sx+sz*.03,H/2-sz*.16,sz*.045,sz*.035)}}
if(role==='survivor'){let grd=ctx.createRadialGradient(W/2,H/2,4,W/2,H/2,flash?H*.65:H*.18);grd.addColorStop(0,'#00000000');grd.addColorStop(.55,night?'#00000010':'#00000044');grd.addColorStop(1,'#000000f5');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H)}else if(night){ctx.fillStyle='#2dffe21c';ctx.fillRect(0,0,W,H)}
}
function end(title,text){running=false;$('endTitle').textContent=title;$('endText').textContent=text;$('end').classList.remove('hidden')}
function loop(now){
 if(!running)return;
 let dt=Math.min(.04,(now-last)/1000);last=now;elapsed+=dt;
 let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
 let s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 let speed=role==='animatronic'?2.35:2.05;
 let dx=(Math.cos(angle)*f-Math.sin(angle)*s)*speed*dt;
 let dy=(Math.sin(angle)*f+Math.cos(angle)*s)*speed*dt;
 [px,py]=move(px,py,dx,dy);
 let dist=Math.hypot(mx-px,my-py);
 if(role==='survivor'){
  if(flash&&battery>0)battery=Math.max(0,battery-dt*1.7);
  if(!battery)flash=false;
  if(!networkGame&&elapsed>12){let a=Math.atan2(py-my,px-mx);[mx,my]=move(mx,my,Math.cos(a)*.58*dt,Math.sin(a)*.58*dt)}
  if(!networkGame&&dist<.45){end('ТЕБЯ ПОЙМАЛИ','Существо настигло тебя в коридоре. Вернись в меню и попробуй снова.');return}
  if(!networkGame&&px>14.1&&py>7&&py<9){end('ТЫ ВЫБРАЛСЯ','Ты добрался до выхода. Это пока тестовая карта.');return}
  $('objective').textContent='ФОНАРЬ '+Math.round(battery)+'% · НАЙДИ ВЫХОД';
 }else{
  $('objective').textContent=night?'НОЧНОЕ ЗРЕНИЕ ВКЛЮЧЕНО':'ПОИСК ИГРОКОВ';
 }
 if(networkGame&&socket?.connected&&now-lastNetSend>80){socket.emit('player:move',{x:px,y:py,angle});lastNetSend=now}
 $('clock').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');
 render();requestAnimationFrame(loop)
}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='f'&&running){if(role==='animatronic')night=!night;else if(battery>0)flash=!flash}if(k==='e'&&running&&networkGame&&role==='animatronic')tryTagNearest();if(k==='escape'&&running){running=false;$('hud').classList.add('hidden');$('menu').classList.remove('hidden')}});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('click',()=>{if(running&&document.pointerLockElement!==canvas&&matchMedia('(pointer:fine)').matches)canvas.requestPointerLock?.()});
document.addEventListener('mousemove',e=>{if(running&&document.pointerLockElement===canvas)angle+=e.movementX*.0035});
let touchX=null;canvas.addEventListener('touchstart',e=>{if(e.touches.length){touchX=e.touches[0].clientX}},{passive:true});canvas.addEventListener('touchmove',e=>{if(touchX!==null&&e.touches.length){let nx=e.touches[0].clientX;angle+=(nx-touchX)*.009;touchX=nx}},{passive:true});canvas.addEventListener('touchend',()=>touchX=null);
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;for(let ev of ['pointerdown'])b.addEventListener(ev,e=>{e.preventDefault();keys[k]=true});for(let ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false})});
$('play').onclick=()=>{$('mainActions').classList.add('hidden');$('playActions').classList.remove('hidden');$('menuNote').textContent='Выбери режим игры.'};$('mainBack').onclick=()=>{$('playActions').classList.add('hidden');$('mainActions').classList.remove('hidden')};$('single').onclick=()=>{$('playActions').classList.add('hidden');$('roleActions').classList.remove('hidden');$('menuNote').textContent='Выбери сторону.'};$('roleBack').onclick=()=>{$('roleActions').classList.add('hidden');$('playActions').classList.remove('hidden')};$('multi').onclick=()=>{$('playActions').classList.add('hidden');$('multiPanel').classList.remove('hidden');$('menuNote').textContent='Создай комнату или введи код друга.'};$('multiBack').onclick=()=>{$('multiPanel').classList.add('hidden');$('playActions').classList.remove('hidden')};$('settings').onclick=()=>{$('menuNote').textContent='Настройки появятся позже.'};$('language').onclick=()=>{$('menuNote').textContent='Пока доступен только русский язык.'};$('exit').onclick=()=>{$('menuNote').textContent='Можно закрыть вкладку браузера.'};$('survivor').onclick=()=>start('survivor');$('animatronic').onclick=()=>start('animatronic');$('back').onclick=()=>{running=false;$('end').classList.add('hidden');$('hud').classList.add('hidden');$('menu').classList.remove('hidden')};$('touchUse').onclick=()=>{if(networkGame&&role==='animatronic')tryTagNearest();};$('touchPower').onclick=()=>{if(role==='animatronic')night=!night;else if(battery>0)flash=!flash};
let socket=null,currentRoom=null,isHost=false,isReady=false;function tryTagNearest(){
 if(!socket?.connected)return;
 const target=Object.values(remotePlayers).filter(p=>p.role==='survivor').sort((a,b)=>Math.hypot(a.x-px,a.y-py)-Math.hypot(b.x-px,b.y-py))[0];
 if(!target){netStatus('Рядом нет игроков.');return}
 if(Math.hypot(target.x-px,target.y-py)>1.15){netStatus('Подойди ближе к игроку.');return}

}function netStatus(t){$('menuNote').textContent=t}function getSocket(){if(socket?.connected)return socket;if(typeof window.io!=='function'){netStatus('Сервер не подключён: открой игру с адреса запущенного сервера.');return null}socket=window.io();socket.on('connect',()=>netStatus('Соединение с сервером установлено.'));socket.on('connect_error',()=>netStatus('Не удалось подключиться к серверу.'));socket.on('room:update',room=>{currentRoom=room;drawLobby(room)});socket.on('game:notice',msg=>netStatus(msg));socket.on('game:started',room=>{currentRoom=room;const me=room.players.find(p=>p.id===socket.id);remotePlayers={};room.players.filter(p=>p.id!==socket.id).forEach(p=>remotePlayers[p.id]=p);if(me){networkGame=true;role=me.role||'survivor';px=me.x;py=me.y;angle=me.angle||0;mx=12.5;my=8.5;elapsed=0;night=false;flash=true;battery=100;running=true;$('menu').classList.add('hidden');$('end').classList.add('hidden');$('hud').classList.remove('hidden');$('roleLabel').textContent='СЕТЕВАЯ ИГРА: '+(role==='animatronic'?'АНИМАТРОНИК':'ИГРОК');$('objective').textContent=role==='animatronic'?'НАЙДИ ИГРОКОВ':'ИЗБЕГАЙ АНИМАТРОНИКА';$('hint').textContent='WASD — движение · мышь — обзор · F — '+(role==='animatronic'?'ночное зрение':'фонарь');last=performance.now();requestAnimationFrame(loop);netStatus('Матч начался! Игроки синхронизируются по сети.')}});socket.on('player:moved',p=>{if(p&&p.id)remotePlayers[p.id]=p});socket.on('game:ended',result=>{running=false;networkGame=false;$('hud').classList.add('hidden');end('МАТЧ ЗАВЕРШЁН',result?.message||'Раунд завершён.')});socket.on('room:update',room=>{currentRoom=room;if(room.status==='playing'){remotePlayers={};room.players.filter(p=>p.id!==socket.id).forEach(p=>remotePlayers[p.id]=p)}drawLobby(room)});return socket}function drawLobby(room){if(socket?.id&&room.hostId)isHost=socket.id===room.hostId;$('lobbyList').classList.remove('hidden');$('lobbyActions').classList.remove('hidden');$('lobbyList').innerHTML='<b>КОМНАТА '+room.code+'</
